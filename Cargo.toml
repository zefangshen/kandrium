[workspace]
resolver = "2"
members = ["crates/core", "crates/mcp", "crates/app", "crates/pdf-render"]
# The gpui app is its own workspace (`crates/app-gpui/Cargo.toml`) so the
# shipping egui build, tests and clippy keep the exact cost they had before the
# migration. It must be built explicitly:
#   cargo run --manifest-path crates/app-gpui/Cargo.toml
exclude = ["crates/app-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"

[workspace.dependencies]
# PDF rasterization for the Documents section.
hayro = "0.7.1"
# Date/time parsing and formatting.
jiff = "0.2"

[profile.release]
lto = "thin"
strip = true
