[workspace]
resolver = "2"
members = ["crates/core", "crates/mcp", "crates/app-gpui", "crates/pdf-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"

[workspace.dependencies]
# PDF rasterization for the Documents section.
hayro = "0.7.1"
# Date/time parsing and formatting.
jiff = "0.2"

[profile.release]
lto = "thin"
strip = true
