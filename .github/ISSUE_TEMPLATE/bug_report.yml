name: Bug report
description: Something in Kandrium is broken
labels: [bug, status:triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Search existing issues first.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - app (desktop UI)
        - core (data layer / kandrium-core)
        - mcp (MCP server / kandrium-mcp)
        - import (kandrium-import / migration)
        - packaging (DMG / .app bundle)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open board "Career"
        2. Drag card X to column Y
        3. ...
    validations:
      required: true

  - type: checkboxes
    id: db-context
    attributes:
      label: Environment
      options:
        - label: Using default DB location (~/Library/Application Support/kandrium/)
        - label: Using KANDRIUM_DB override
        - label: Issue involves MCP server running alongside the app
        - label: Issue involves legacy planly data migration

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
