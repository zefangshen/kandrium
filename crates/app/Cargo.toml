[package]
name = "kandrium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kandrium Kanban desktop app (egui)"

[[bin]]
name = "kandrium-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["default", "persistence"] }
egui = "0.36.2"
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.36.2", features = ["svg", "datepicker", "serde"] }
jiff = "0.2"
kandrium-core = { path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
# objc 0.2 msg_send! macro expansion emits cfg(feature = "cargo-clippy")
unexpected_cfgs = { level = "allow", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
