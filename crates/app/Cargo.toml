[package]
name = "kandrium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kandrium desktop app"
publish = false

[[bin]]
name = "kandrium-app"
path = "src/main.rs"

[dependencies]
# Exact pins: the migration must be reproducible, not current.
gpui-kit = "=0.9.1"
# The code-editor mode's Markdown highlighting lives behind a feature on the
# component crate gpui-kit already pulls in; this entry only turns it on.
gpui-component = { version = "=0.9.1", features = ["tree-sitter-markdown"] }
kandrium-core = { path = "../core" }
pdf-render = { path = "../pdf-render" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Same version as `kandrium-core`; its `Timestamp` is part of the core API.
jiff = "0.2"
rfd = "0.15"
image = "0.25.1"
smallvec = "1"

[dev-dependencies]
# `gpui` is reachable by name only through the `gpui-pre` package (its lib is
# named `gpui`); gpui-kit's `test-support` adds the snapshot/click layer
# (`gpui_kit::test`) and turns on `gpui-base/test-support`, which is what makes
# observation and synchronous observers work.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
tempfile = "3"
