[package]
name = "kandrium-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kandrium MCP server (stdio) exposing Kanban tools over the shared SQLite database"

[[bin]]
name = "kandrium-mcp"
path = "src/main.rs"

[dependencies]
kandrium-core = { path = "../core" }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full", "io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
