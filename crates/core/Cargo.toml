[package]
name = "kandrium-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kandrium data layer: SQLite schema, services, seed, and legacy import"

[dependencies]
dirs = "7.0.0"
jiff = { workspace = true }
log = "0.4"
pdf-render = { path = "../pdf-render" }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
